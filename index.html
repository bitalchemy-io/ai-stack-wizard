<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ai-stack-wizard · Local AI Stack Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #060810;
  --surface:  #0c0e1a;
  --surface2: #131628;
  --border:   #1c2040;
  --border2:  #2a3060;
  --text:     #d4deff;
  --muted:    #4a5580;
  --dim:      #8090c0;
  --violet:   #7c6dff;
  --violet2:  #a090ff;
  --cyan:     #00e5ff;
  --green:    #00e676;
  --amber:    #ffb300;
  --red:      #ff5252;
  --mono:     'Fira Code', monospace;
  --sans:     'Space Grotesk', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  min-height:100vh;
}

/* Neural net background */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 20% 50%, rgba(124,109,255,.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(0,229,255,.04) 0%, transparent 40%),
    linear-gradient(rgba(124,109,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,109,255,.03) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,48px 48px,48px 48px;
  pointer-events:none;z-index:0;
}

/* ── Header ── */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(6,8,16,.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 32px;height:60px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.logo{
  font-family:var(--mono);font-size:14px;
  color:var(--violet2);
  display:flex;align-items:center;gap:10px;
}
.logo-mark{
  width:30px;height:30px;
  background:linear-gradient(135deg,var(--violet),var(--cyan));
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;font-weight:700;
  flex-shrink:0;
}
.header-center{
  display:flex;align-items:center;gap:8px;
}
.ram-label{
  font-family:var(--mono);font-size:11px;color:var(--muted);
}
.ram-btn{
  padding:5px 14px;
  border-radius:20px;
  font-family:var(--mono);font-size:11px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--dim);
  cursor:pointer;
  transition:all .15s;
}
.ram-btn:hover{border-color:var(--violet);color:var(--text);}
.ram-btn.active{
  background:#1a1540;
  border-color:var(--violet);
  color:var(--violet2);
}
.header-right{display:flex;align-items:center;gap:10px;}
.sel-badge{
  font-family:var(--mono);font-size:11px;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;
}
.sel-badge span{color:var(--violet2);}
.btn-dl{
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  color:#fff;border:none;border-radius:8px;
  padding:9px 20px;
  font-family:var(--sans);font-size:13px;font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:opacity .15s,transform .1s;
}
.btn-dl:hover{opacity:.9;}
.btn-dl:active{transform:scale(.98);}
.btn-dl:disabled{opacity:.3;cursor:not-allowed;}

/* ── Layout ── */
.layout{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:1fr 400px;
  min-height:calc(100vh - 60px);
}

/* ── Left ── */
.left{padding:28px 32px;overflow-y:auto;}

.page-hero{margin-bottom:32px;}
.page-title{
  font-size:28px;font-weight:700;
  background:linear-gradient(135deg,var(--text) 40%,var(--violet2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:6px;
}
.page-sub{
  font-family:var(--mono);font-size:12px;color:var(--muted);
}

/* RAM recommendation banner */
.ram-banner{
  margin-bottom:24px;
  padding:12px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--violet);
  border-radius:8px;
  font-family:var(--mono);font-size:12px;
  color:var(--dim);
  display:none;
}
.ram-banner.show{display:block;}
.ram-banner strong{color:var(--violet2);}

/* ── Category block ── */
.cat-block{margin-bottom:32px;}
.cat-label{
  font-family:var(--mono);font-size:10px;
  text-transform:uppercase;letter-spacing:.16em;
  color:var(--muted);
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.cat-icon{font-size:14px;}

/* ── Service card ── */
.services-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:10px;
}
.svc-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;padding:14px;
  cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;
  user-select:none;position:relative;
  animation:fadeUp .4s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.svc-card:hover{border-color:var(--border2);background:var(--surface2);}
.svc-card.selected{border-color:var(--violet);background:#110d2a;}
.svc-card.selected::after{
  content:'✓';
  position:absolute;top:10px;right:12px;
  font-size:11px;font-weight:700;color:var(--violet2);
  font-family:var(--mono);
}
.svc-icon{font-size:22px;margin-bottom:8px;display:block;}
.svc-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
.svc-desc{font-size:11px;color:var(--muted);line-height:1.4;}
.svc-tag{
  display:inline-block;margin-top:8px;
  font-family:var(--mono);font-size:9px;
  padding:2px 7px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--dim);
}
.svc-card.selected .svc-tag{
  background:#1a1040;border-color:var(--violet);color:var(--violet2);
}
.ram-badge{
  display:inline-block;margin-top:5px;margin-left:4px;
  font-family:var(--mono);font-size:9px;
  padding:2px 7px;border-radius:8px;
  background:#1a1200;border:1px solid var(--amber)44;color:var(--amber);
}
.rec-badge{
  display:inline-block;margin-top:5px;margin-left:4px;
  font-family:var(--mono);font-size:9px;
  padding:2px 7px;border-radius:8px;
  background:#0d1a0d;border:1px solid var(--green)44;color:var(--green);
}

/* ── Model picker ── */
.model-section{
  margin-bottom:32px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;padding:18px;
}
.model-title{
  font-family:var(--mono);font-size:10px;
  text-transform:uppercase;letter-spacing:.16em;
  color:var(--muted);margin-bottom:14px;
}
.model-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:8px;
}
.model-card{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;padding:12px;
  cursor:pointer;
  transition:border-color .15s;
  user-select:none;
}
.model-card:hover{border-color:var(--border2);}
.model-card.selected{border-color:var(--cyan);background:#001a1a;}
.model-name{
  font-family:var(--mono);font-size:12px;
  font-weight:500;color:var(--text);margin-bottom:4px;
}
.model-meta{font-size:10px;color:var(--muted);line-height:1.4;}
.model-ram{
  display:inline-block;margin-top:6px;
  font-family:var(--mono);font-size:9px;
  padding:2px 8px;border-radius:8px;
}
.ram-low{background:#0d1a0d;border:1px solid var(--green)44;color:var(--green);}
.ram-med{background:#1a1200;border:1px solid var(--amber)44;color:var(--amber);}
.ram-high{background:#1a0d00;border:1px solid var(--red)44;color:var(--red);}

/* ── Right panel ── */
.right{
  background:var(--surface);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:60px;
  height:calc(100vh - 60px);
}
.preview-hdr{
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.preview-title{
  font-family:var(--mono);font-size:10px;
  text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
}
.preview-lines{font-family:var(--mono);font-size:11px;color:var(--muted);}
.preview-body{
  flex:1;overflow-y:auto;padding:16px 20px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
pre#yamlOut{
  font-family:var(--mono);font-size:11px;
  line-height:1.7;color:#a0b0e0;
  white-space:pre;tab-size:2;
}
.y-comment{color:#2e4060;font-style:italic;}
.y-key{color:#7c9eff;}
.y-val{color:#7fffd4;}
.y-str{color:#ffb3c1;}
.y-anchor{color:var(--amber);}

.empty-preview{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:100%;gap:14px;
  color:var(--muted);font-family:var(--mono);font-size:12px;
  text-align:center;padding:24px;
}
.empty-icon{font-size:48px;opacity:.2;}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(6,8,16,.88);
  backdrop-filter:blur(6px);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:14px;
  width:100%;max-width:520px;
  max-height:85vh;
  display:flex;flex-direction:column;
  transform:translateY(12px);
  transition:transform .2s;
}
.modal-overlay.open .modal{transform:none;}
.modal-hdr{
  padding:20px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.modal-title{font-size:16px;font-weight:600;}
.modal-x{
  background:none;border:none;color:var(--muted);
  font-size:20px;cursor:pointer;padding:2px 6px;border-radius:4px;
  transition:color .15s,background .15s;
}
.modal-x:hover{color:var(--text);background:var(--surface2);}
.modal-body{padding:20px 24px;overflow-y:auto;}
.modal-ftr{
  padding:14px 24px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;
}
.field-grp{margin-bottom:16px;}
.field-lbl{
  font-family:var(--mono);font-size:10px;
  text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);margin-bottom:6px;display:block;
}
.field-in{
  width:100%;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:9px 12px;color:var(--text);
  font-family:var(--mono);font-size:12px;outline:none;
  transition:border-color .15s;
}
.field-in:focus{border-color:var(--violet);}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px;}
.btn-cancel{
  background:none;border:1px solid var(--border);border-radius:6px;
  padding:8px 18px;color:var(--muted);
  font-family:var(--sans);font-size:13px;cursor:pointer;
  transition:border-color .15s,color .15s;
}
.btn-cancel:hover{border-color:var(--border2);color:var(--text);}
.btn-apply{
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  color:#fff;border:none;border-radius:6px;
  padding:8px 20px;font-family:var(--sans);font-size:13px;font-weight:600;
  cursor:pointer;transition:opacity .15s;
}
.btn-apply:hover{opacity:.9;}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;}
  .right{position:fixed;bottom:0;left:0;right:0;height:40vh;top:auto;border-top:1px solid var(--border);}
  .left{padding-bottom:44vh;}
  .header-center{display:none;}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-mark">🤖</div>
    ai-stack-wizard
  </div>
  <div class="header-center">
    <span class="ram-label">Your RAM:</span>
    <button class="ram-btn" onclick="setRam('8')">8 GB</button>
    <button class="ram-btn" onclick="setRam('16')">16 GB</button>
    <button class="ram-btn" onclick="setRam('32')">32 GB</button>
    <button class="ram-btn" onclick="setRam('64')">64 GB</button>
  </div>
  <div class="header-right">
    <div class="sel-badge"><span id="selCount">0</span> selected</div>
    <button class="btn-dl" id="btnDl" disabled onclick="downloadYaml()">↓ docker-compose.yml</button>
  </div>
</header>

<div class="layout">
  <div class="left">
    <div class="page-hero">
      <div class="page-title">Local AI Stack Generator</div>
      <div class="page-sub">// pick your services → configure → run your own private AI</div>
    </div>

    <div class="ram-banner" id="ramBanner"></div>

    <!-- Model picker -->
    <div class="model-section">
      <div class="model-title">🧠 Ollama Models — select which models to pull on startup</div>
      <div class="model-grid" id="modelGrid"></div>
    </div>

    <!-- Service categories -->
    <div id="serviceCategories"></div>
  </div>

  <div class="right">
    <div class="preview-hdr">
      <div class="preview-title">docker-compose.yml</div>
      <div class="preview-lines" id="previewLines">— lines</div>
    </div>
    <div class="preview-body">
      <div class="empty-preview" id="emptyPrev">
        <div class="empty-icon">🤖</div>
        <div>Select services<br>to generate your AI stack</div>
      </div>
      <pre id="yamlOut" style="display:none;"></pre>
    </div>
  </div>
</div>

<!-- Config Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="modalTitle">Configure</div>
      <button class="modal-x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-ftr">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-apply" onclick="applyConfig()">Apply</button>
    </div>
  </div>
</div>

<script>
// ── Models ────────────────────────────────────────────────────
const MODELS = [
  { id:'llama3.2:3b',   name:'Llama 3.2 3B',   desc:'Fast, lightweight. Great for simple tasks.',  ram:'8',  ramClass:'ram-low'  },
  { id:'llama3.2:8b',   name:'Llama 3.2 8B',   desc:'Best balance of speed and quality.',          ram:'16', ramClass:'ram-med'  },
  { id:'llama3.1:70b',  name:'Llama 3.1 70B',  desc:'Flagship model, near-GPT-4 quality.',        ram:'48', ramClass:'ram-high' },
  { id:'mistral:7b',    name:'Mistral 7B',      desc:'Excellent reasoning, very efficient.',        ram:'8',  ramClass:'ram-low'  },
  { id:'gemma3:9b',     name:'Gemma 3 9B',      desc:'Google\'s latest, great for coding.',         ram:'16', ramClass:'ram-med'  },
  { id:'qwen2.5:14b',   name:'Qwen 2.5 14B',   desc:'Strong multilingual & code skills.',          ram:'16', ramClass:'ram-med'  },
  { id:'deepseek-r1:8b',name:'DeepSeek R1 8B',  desc:'Strong reasoning & math.',                   ram:'16', ramClass:'ram-med'  },
  { id:'phi4:14b',      name:'Phi-4 14B',       desc:'Microsoft\'s compact powerhouse.',            ram:'16', ramClass:'ram-med'  },
  { id:'nomic-embed-text',name:'Nomic Embed',   desc:'Text embeddings for RAG pipelines.',          ram:'4',  ramClass:'ram-low'  },
  { id:'llava:13b',     name:'LLaVA 13B',       desc:'Vision model — describe images.',            ram:'16', ramClass:'ram-med'  },
];

// ── Services ──────────────────────────────────────────────────
const SERVICES = {

  ollama: {
    name:'Ollama', icon:'🦙', cat:'Core Inference',
    desc:'Run large language models locally',
    tag:'ollama/ollama:latest',
    required:true,
    fields:[
      {key:'port', label:'Port', default:'11434'},
      {key:'models_path', label:'Models path', default:'/opt/ollama/models', hint:'Where model weights are stored (can be large!)'},
    ],
    yaml:(c,models)=>`
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${c.port}:11434"
    volumes:
      - ${c.models_path}:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2${models.length ? `
    # Pull models on startup
    entrypoint: ["/bin/sh","-c","ollama serve & sleep 5 ${models.map(m=>`&& ollama pull ${m}`).join(' ')} && wait"]` : ''}`.trim(),
    volumes:()=>[],
  },

  openwebui: {
    name:'Open WebUI', icon:'💬', cat:'Chat Interface',
    desc:'ChatGPT-like UI for your local models',
    tag:'ghcr.io/open-webui/open-webui:main',
    fields:[
      {key:'port', label:'Port', default:'3000'},
      {key:'secret', label:'Secret key', default:'CHANGE_ME_RANDOM_SECRET', hint:'Used for session signing'},
    ],
    yaml:(c)=>`
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${c.port}:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${c.secret}
    depends_on:
      - ollama`.trim(),
    volumes:()=>['open-webui'],
  },

  n8n: {
    name:'n8n', icon:'⚡', cat:'Workflow Automation',
    desc:'Automate everything with AI-powered workflows',
    tag:'n8nio/n8n:latest',
    fields:[
      {key:'port',     label:'Port',           default:'5678'},
      {key:'user',     label:'Basic auth user', default:'admin'},
      {key:'password', label:'Basic auth pass', default:'changeme'},
      {key:'webhook_url', label:'Webhook URL',  default:'http://localhost:5678', hint:'Public URL for incoming webhooks'},
    ],
    yaml:(c)=>`
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${c.port}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${c.user}
      - N8N_BASIC_AUTH_PASSWORD=${c.password}
      - WEBHOOK_URL=${c.webhook_url}
      - OLLAMA_HOST=http://ollama:11434
      - N8N_RUNNERS_ENABLED=true`.trim(),
    volumes:()=>['n8n-data'],
  },

  flowise: {
    name:'Flowise', icon:'🌊', cat:'AI Agents & RAG',
    desc:'Build LLM apps, RAG pipelines & AI agents visually',
    tag:'flowiseai/flowise:latest',
    fields:[
      {key:'port',     label:'Port',     default:'3001'},
      {key:'user',     label:'Username', default:'admin'},
      {key:'password', label:'Password', default:'changeme'},
    ],
    yaml:(c)=>`
  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    restart: unless-stopped
    ports:
      - "${c.port}:3000"
    volumes:
      - flowise-data:/root/.flowise
    environment:
      - FLOWISE_USERNAME=${c.user}
      - FLOWISE_PASSWORD=${c.password}
      - OLLAMA_BASE_URL=http://ollama:11434`.trim(),
    volumes:()=>['flowise-data'],
  },

  litellm: {
    name:'LiteLLM', icon:'🔀', cat:'AI Gateway',
    desc:'Unified API proxy for all your AI models',
    tag:'ghcr.io/berriai/litellm:main-latest',
    fields:[
      {key:'port',       label:'Port',          default:'4000'},
      {key:'master_key', label:'Master API key', default:'sk-local-master-key', hint:'Used to authenticate LiteLLM requests'},
    ],
    yaml:(c)=>`
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${c.port}:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${c.master_key}
      - OLLAMA_API_BASE=http://ollama:11434
    command: ["--config", "/app/config.yaml", "--port", "4000"]`.trim(),
    volumes:()=>[],
  },

  qdrant: {
    name:'Qdrant', icon:'🗄️', cat:'AI Agents & RAG',
    desc:'Vector database for RAG & semantic search',
    tag:'qdrant/qdrant:latest',
    fields:[
      {key:'port_http', label:'HTTP port', default:'6333'},
      {key:'port_grpc', label:'gRPC port', default:'6334'},
    ],
    yaml:(c)=>`
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${c.port_http}:6333"
      - "${c.port_grpc}:6334"
    volumes:

// ── State ─────────────────────────────────────────────────────
const selected = {};
const selectedModels = new Set();
let currentRam = null;
let editingId = null;
let tempCfg = {};

// ── Init ──────────────────────────────────────────────────────
function init() {
  renderModels();
  renderServices();
  // Auto-select Ollama
  selected['ollama'] = defaultConfig('ollama');
  document.getElementById('card-ollama')?.classList.add('selected');
  updateUI();
}

function defaultConfig(id) {
  const svc = SERVICES[id];
  const cfg = {};
  (svc.fields||[]).forEach(f => cfg[f.key] = f.default);
  return cfg;
}

// ── Models ────────────────────────────────────────────────────
function renderModels() {
  const grid = document.getElementById('modelGrid');
  grid.innerHTML = MODELS.map(m => `
    <div class="model-card" id="model-${m.id.replace(':','-')}"
         onclick="toggleModel('${m.id}')">
      <div class="model-name">${m.name}</div>
      <div class="model-meta">${m.desc}</div>
      <span class="model-ram ${m.ramClass}">~${m.ram} GB RAM</span>
    </div>
  `).join('');
}

function toggleModel(id) {
  const el = document.getElementById('model-' + id.replace(':','-'));
  if (selectedModels.has(id)) {
    selectedModels.delete(id);
    el?.classList.remove('selected');
  } else {
    selectedModels.add(id);
    el?.classList.add('selected');
  }
  updateUI();
}

// ── Services ──────────────────────────────────────────────────
function renderServices() {
  const cats = {};
  Object.entries(SERVICES).forEach(([id, svc]) => {
    if (!cats[svc.cat]) cats[svc.cat] = [];
    cats[svc.cat].push({id,...svc});
  });

  const catIcons = {
    'Core Inference':'🦙','Chat Interface':'💬',
    'Workflow Automation':'⚡','AI Agents & RAG':'🧠',
    'AI Gateway':'🔀','Observability':'📊',
    'Audio & Speech':'🎙️','Document AI':'📄',
  };

  const container = document.getElementById('serviceCategories');
  let delay = 0;
  Object.entries(cats).forEach(([cat, svcs]) => {
    const block = document.createElement('div');
    block.className = 'cat-block';
    block.innerHTML = `
      <div class="cat-label">
        <span class="cat-icon">${catIcons[cat]||'▸'}</span>${cat}
      </div>
      <div class="services-grid">
        ${svcs.map(s => svcCardHTML(s, delay+=50)).join('')}
      </div>`;
    container.appendChild(block);
  });
}

function svcCardHTML(s, delay) {
  const isRequired = s.required;
  return `
    <div class="svc-card${isRequired?' selected':''}" id="card-${s.id}"
         onclick="toggleSvc('${s.id}')"
         style="animation-delay:${delay}ms">
      <span class="svc-icon">${s.icon}</span>
      <div class="svc-name">${s.name}${isRequired?'<span style="font-size:9px;color:var(--muted);margin-left:6px;">required</span>':''}</div>
      <div class="svc-desc">${s.desc}</div>
      <span class="svc-tag">${s.tag}</span>
    </div>`;
}

// ── RAM filter ────────────────────────────────────────────────
const RAM_TIPS = {
  '8':  'With 8 GB RAM, stick to <strong>3B–7B models</strong>. Recommended: Llama 3.2 3B, Mistral 7B. Avoid running Flowise + n8n simultaneously.',
  '16': 'With 16 GB RAM, you can comfortably run <strong>7B–14B models</strong>. Recommended: Llama 3.2 8B, Gemma 3 9B, Qwen 2.5 14B.',
  '32': 'With 32 GB RAM, <strong>14B–34B models</strong> run well. You can also run the full stack simultaneously.',
  '64': 'With 64 GB RAM, you can run <strong>70B models</strong> and the complete AI stack with room to spare. 🚀',
};

function setRam(val) {
  currentRam = val;
  document.querySelectorAll('.ram-btn').forEach(b =>
    b.classList.toggle('active', b.textContent.trim().startsWith(val)));
  const banner = document.getElementById('ramBanner');
  banner.innerHTML = `<strong>${val} GB RAM detected</strong> — ${RAM_TIPS[val]}`;
  banner.classList.add('show');
}

// ── Toggle service ────────────────────────────────────────────
function toggleSvc(id) {
  if (SERVICES[id].required) return;
  if (selected[id]) {
    delete selected[id];
    document.getElementById('card-'+id)?.classList.remove('selected');
    updateUI();
  } else {
    openModal(id);
  }
}

function openModal(id) {
  editingId = id;
  const svc = SERVICES[id];
  tempCfg = {};
  (svc.fields||[]).forEach(f => {
    tempCfg[f.key] = (selected[id]?.[f.key]) ?? f.default;
  });
  document.getElementById('modalTitle').textContent = `${svc.icon} ${svc.name}`;
  document.getElementById('modalBody').innerHTML = (svc.fields||[]).map(f=>`
    <div class="field-grp">
      <label class="field-lbl" for="f-${f.key}">${f.label}</label>
      <input class="field-in" id="f-${f.key}" type="text"
        value="${esc(tempCfg[f.key])}"
        oninput="tempCfg['${f.key}']=this.value"
        placeholder="${esc(f.default)}">
      ${f.hint?`<div class="field-hint">${f.hint}</div>`:''}
    </div>`).join('');
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>{document.querySelector('#modalBody .field-in')?.focus();},100);
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  editingId=null;
}
function handleOverlayClick(e){
  if(e.target===document.getElementById('modalOverlay'))closeModal();
}
function applyConfig(){
  if(!editingId)return;
  selected[editingId]={...tempCfg};
  document.getElementById('card-'+editingId)?.classList.add('selected');
  closeModal();
  updateUI();
}

// ── YAML generation ───────────────────────────────────────────
function generateYaml(){
  const ids = Object.keys(selected);
  if(!ids.length)return'';

  const models = [...selectedModels];
  let services='';
  const vols = new Set();

  ids.forEach(id=>{
    const svc=SERVICES[id];
    const cfg=selected[id];
    const block = id==='ollama' ? svc.yaml(cfg,models) : svc.yaml(cfg);
    services += `\n  # ── ${svc.name} ──\n${block}\n`;
    svc.volumes(cfg).forEach(v=>vols.add(v));
  });

  let yaml = `# Generated by ai-stack-wizard\n# https://github.com/bitalchemy-io/ai-stack-wizard\n# Your private AI stack — no cloud required 🤖\n\nservices:\n${services}`;
  if(vols.size){
    yaml+='\nvolumes:\n';
    vols.forEach(v=>yaml+=`  ${v}:\n`);
  }

  yaml+='\nnetworks:\n  default:\n    name: ai-stack\n';
  return yaml;
}

function syntaxHL(yaml){
  return yaml.split('\n').map(line=>{
    if(line.trimStart().startsWith('#')) return `<span class="y-comment">${esc(line)}</span>`;
    const m=line.match(/^(\s*)([a-zA-Z_.\-]+)(\s*:\s*)(.*)$/);
    if(m){
      let v='';
      if(m[4].startsWith('"')||m[4].startsWith("'")) v=`<span class="y-str">${esc(m[4])}</span>`;
      else if(m[4].startsWith('$')) v=`<span class="y-anchor">${esc(m[4])}</span>`;
      else if(m[4]) v=`<span class="y-val">${esc(m[4])}</span>`;
      return `${esc(m[1])}<span class="y-key">${esc(m[2])}</span>${esc(m[3])}${v}`;
    }
    if(line.match(/^\s+-\s/)) return `<span class="y-str">${esc(line)}</span>`;
    return esc(line);
  }).join('\n');
}

// ── UI Update ─────────────────────────────────────────────────
function updateUI(){
  const count=Object.keys(selected).length;
  document.getElementById('selCount').textContent=count;
  document.getElementById('btnDl').disabled=count===0;
  const yaml=generateYaml();
  const pre=document.getElementById('yamlOut');
  const empty=document.getElementById('emptyPrev');
  if(!yaml){pre.style.display='none';empty.style.display='flex';}
  else{
    empty.style.display='none';pre.style.display='block';
    pre.innerHTML=syntaxHL(yaml);
    document.getElementById('previewLines').textContent=yaml.split('\n').length+' lines';
  }
}

function downloadYaml(){
  const yaml=generateYaml();
  if(!yaml)return;
  const blob=new Blob([yaml],{type:'text/yaml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='docker-compose.yml';a.click();
  URL.revokeObjectURL(url);
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
init();
</script>
